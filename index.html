<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wobble Badminton</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1d23;
        font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #e8eaee;
      }
      #hud-top {
        position: absolute;
        top: 10px;
        left: 12px;
        font-size: 13px;
        line-height: 1.6;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      #hud-title {
        font-weight: 700;
        font-size: 15px;
      }
      #hud-message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        max-width: 520px;
        padding: 16px 22px;
        border-radius: 10px;
        background: rgba(20, 22, 28, 0.85);
        font-size: 15px;
        line-height: 1.7;
        text-align: center;
        white-space: pre-line;
      }
      #hud-message.error {
        background: rgba(90, 24, 24, 0.9);
      }
      #hud-message[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="hud-top">
        <div id="hud-title">Wobble Badminton</div>
        <div id="hud-fps">FPS: --</div>
      </div>
      <div id="hud-message" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
